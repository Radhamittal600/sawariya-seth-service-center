services:
  - type: web
    name: sawariya-seth-service-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 run:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
